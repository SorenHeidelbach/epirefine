[project]
name = "epirefine"
version = "0.11.0"
description = "Refine metagenome bins from nanopore methylation: flag contaminants and place unbinned contigs, with calibrated probabilities"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Søren Heidelbach", email = "shei@bio.aau.dk" }]
maintainers = [{ name = "Søren Heidelbach", email = "shei@bio.aau.dk" }]
keywords = ["metagenomics", "binning", "bin refinement", "nanopore", "DNA methylation", "Nanomotif", "MAG"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "polars>=1.2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/SorenHeidelbach/epirefine"
Repository = "https://github.com/SorenHeidelbach/epirefine"
Documentation = "https://github.com/SorenHeidelbach/epirefine/blob/main/docs/README.md"
Issues = "https://github.com/SorenHeidelbach/epirefine/issues"
Changelog = "https://github.com/SorenHeidelbach/epirefine/blob/main/CHANGELOG.md"

[project.scripts]
epirefine = "epirefine.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/epirefine"]

# the source distribution carries what is needed to build, test and judge the tool; not the dev hooks or CI files
[tool.hatch.build.targets.sdist]
include = ["src/epirefine", "tests", "docs", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]
