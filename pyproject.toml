[project]
name = "epirefine"
version = "0.9.2"
description = "EpiRefine: bin refinement from nanopore methylation, contamination detection and contig inclusion (builds on Nanomotif output)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "polars>=1.2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
epirefine = "epirefine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/epirefine"]
