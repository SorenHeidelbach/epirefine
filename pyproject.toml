[project]
name = "pbinner"
version = "0.4.0"
description = "Probabilistic plasmid-host assignment from nanopore methylation (builds on Nanomotif output)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "polars>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pbinner = "pbinner.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pbinner"]
