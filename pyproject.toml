[project]
name = "epirefine"
version = "0.11.1"
description = "Refine metagenome bins from nanopore methylation: flag contaminants and place unbinned contigs, with calibrated probabilities"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "rust/THIRD_PARTY_LICENSES.txt"]
authors = [{ name = "Søren Heidelbach", email = "shei@bio.aau.dk" }]
maintainers = [{ name = "Søren Heidelbach", email = "shei@bio.aau.dk" }]
keywords = ["metagenomics", "binning", "bin refinement", "nanopore", "DNA methylation", "Nanomotif", "MAG"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "polars>=1.2"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-xdist>=3"]

[project.urls]
Homepage = "https://github.com/SorenHeidelbach/epirefine"
Repository = "https://github.com/SorenHeidelbach/epirefine"
Documentation = "https://github.com/SorenHeidelbach/epirefine/blob/main/docs/README.md"
Issues = "https://github.com/SorenHeidelbach/epirefine/issues"
Changelog = "https://github.com/SorenHeidelbach/epirefine/blob/main/CHANGELOG.md"

[project.scripts]
epirefine = "epirefine.cli:main"

# The platform wheels carry the compiled kernels (rust/, extension epirefine._kernels._core, abi3 for CPython >= 3.10;
# D73). The pure py3-none-any wheel of the same version is derived from a compiled one by dev/pure_wheel.py (same
# metadata, no extension: EpiRefine then runs its numpy code). An install from the sdist compiles the kernels and
# needs Rust and a C compiler; pip and uv take a wheel whenever one fits, and the pure wheel fits everywhere.
[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[tool.maturin]
python-source = "src"
manifest-path = "rust/Cargo.toml"
module-name = "epirefine._kernels._core"
features = ["pyo3/extension-module"]
# the source distribution carries what is needed to build, test and judge the tool; not the dev hooks or CI files
include = [
    { path = "tests/**/*", format = "sdist" },
    { path = "docs/**/*", format = "sdist" },
    { path = "CHANGELOG.md", format = "sdist" },
    { path = "LICENSE", format = "sdist" },
    { path = "rust/THIRD_PARTY_LICENSES.txt", format = "sdist" },
]
exclude = [
    { path = "**/__pycache__/**", format = "sdist" },
    { path = "**/*.so", format = "sdist" },
]
