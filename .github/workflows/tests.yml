# Unit tests on every push and pull request: every Python version EpiRefine supports, plus the lowest
# dependency versions pyproject.toml allows (so its lower bounds stay true).
name: tests

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q tests

  lowest-dependencies:
    name: Lowest dependency versions (Python 3.10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install with the lowest versions pyproject.toml allows
        run: |
          python -m pip install uv
          uv venv .venv-min
          VIRTUAL_ENV=.venv-min uv pip install --resolution lowest-direct -e ".[dev]"
          .venv-min/bin/python -c "import numpy, scipy, polars; print('numpy', numpy.__version__, 'scipy', scipy.__version__, 'polars', polars.__version__)"
      - name: Test
        run: .venv-min/bin/python -m pytest -q tests
