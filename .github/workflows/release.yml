# Build, test and (on a version tag only) publish EpiRefine (D73, D74).
#
# Wheels: the kernels in rust/ compiled into one abi3 wheel (CPython >= 3.10) per platform: manylinux2014 x86_64 and
# aarch64, musllinux_1_2 x86_64, macOS arm64 and x86_64; the pure py3-none-any wheel derived from the linux x86_64
# one (dev/pure_wheel.py: same metadata, no extension; pip and uv take it only where no compiled wheel fits, and
# EpiRefine then runs its numpy code); and the sdist (compiles the kernels; needs Rust and a C compiler).
# Every wheel is installed and tested before anything is uploaded: Python 3.10 and 3.13 with current dependencies,
# once with the lowest versions pyproject.toml allows, the kernels required to be used (params.json and the CPU path
# checked), and on x86_64 also with the generic CPU path forced. The pure wheel is tested on Python 3.13, and on 3.10
# with the lowest versions (numpy code and warning).
# The sdist is checked for its file list, built from source with Rust (kernels required to load) and tested.
#
# Uploads happen ONLY for a v* tag equal to the version in pyproject.toml: TestPyPI, then PyPI, by trusted publishing
# (environments testpypi and pypi; no tokens), then a GitHub release with every file. A push of a branch, or a
# manual run, builds and tests and uploads nothing (D74: branch pushes run the ARM and macOS builds). The upload jobs
# also require a push event: a manual run (workflow_dispatch) started on a v* tag builds and tests, uploads nothing.
name: release

on:
  push:
    tags: ["v*"]
    # main and release branches: every platform builds and tests before a tag is pushed (build and test only;
    # uploads stay tag-gated).
    branches: ["main", "release/*"]
  workflow_dispatch:

# read-only token by default; the jobs that publish declare their own (id-token, contents: write)
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

env:
  EPIREFINE_RS_COMMIT: ${{ github.sha }}
  # the build tools of every published file, fixed (B6 review P4): change them in tests.yml too, in one commit
  MATURIN_VERSION: "1.16.0"
  RUST_TOOLCHAIN: "1.99.1"

jobs:
  version:
    name: Tag matches the package version
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0 (2026-11-13)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0 (2026-11-13)
        with:
          python-version: "3.12"
      - run: |
          v=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME but pyproject.toml says $v"; exit 1; }

  wheels:
    name: Wheel ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: manylinux2014 x86_64, runner: ubuntu-latest, target: x86_64, manylinux: "2014" }
          - { name: manylinux2014 aarch64, runner: ubuntu-24.04-arm, target: aarch64, manylinux: "2014" }
          - { name: musllinux_1_2 x86_64, runner: ubuntu-latest, target: x86_64-unknown-linux-musl, manylinux: musllinux_1_2 }
          - { name: macOS arm64, runner: macos-15, target: aarch64-apple-darwin, manylinux: "", macos: "11.0" }
          - { name: macOS x86_64, runner: macos-15-intel, target: x86_64-apple-darwin, manylinux: "", macos: "10.12" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0 (2026-11-13)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0 (2026-11-13)
        with:
          python-version: "3.12"
      - name: Build
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1 (2026-11-13)
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos }}
        with:
          command: build
          args: --release --locked --out dist
          maturin-version: ${{ env.MATURIN_VERSION }}
          rust-toolchain: ${{ env.RUST_TOOLCHAIN }}
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          docker-options: -e EPIREFINE_RS_COMMIT
      - name: The wheel is abi3 and names its platform
        shell: bash
        run: ls dist && ls dist/*-cp310-abi3-*.whl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2 (2026-11-13)
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl

  pure-and-sdist:
    name: Pure wheel and sdist
    needs: wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0 (2026-11-13)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0 (2026-11-13)
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0 (2026-11-13)
        with:
          name: wheel-x86_64
          path: compiled
      - name: Derive the pure wheel; build the sdist
        run: |
          python -m pip install "maturin==$MATURIN_VERSION" twine
          mkdir -p dist
          python dev/pure_wheel.py compiled/*manylinux*x86_64*.whl --out dist
          maturin sdist --out dist
          python -m twine check --strict dist/* compiled/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2 (2026-11-13)
        with:
          name: pure-and-sdist
          path: dist/*

  licences:
    name: Third-party licences match Cargo.lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0 (2026-11-13)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0 (2026-11-13)
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master (2026-11-13)
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Cargo.lock agrees with Cargo.toml; the bundled licence file is that of Cargo.lock
        run: |
          (cd rust && cargo fetch --locked)
          python dev/bundle_licenses.py --check

  test-wheels:
    name: Test ${{ matrix.wheel }} on Python ${{ matrix.python }}${{ matrix.lowest && ' (lowest pins)' || '' }}
    needs: wheels
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        wheel: [x86_64, aarch64, aarch64-apple-darwin, x86_64-apple-darwin]
        python: ["3.10", "3.13"]
        lowest: [false]
        include:
          - { wheel: x86_64, runner: ubuntu-latest, simd: true }
          - { wheel: aarch64, runner: ubuntu-24.04-arm, simd: false }
          - { wheel: aarch64-apple-darwin, runner: macos-15, simd: false }
          - { wheel: x86_64-apple-darwin, runner: macos-15-intel, simd: true }
          - { wheel: x86_64, runner: ubuntu-latest, simd: true, python: "3.10", lowest: true }
          - { wheel: aarch64, runner: ubuntu-24.04-arm, simd: false, python: "3.10", lowest: true }
          - { wheel: aarch64-apple-darwin, runner: macos-15, simd: false, python: "3.10", lowest: true }
          - { wheel: x86_64-apple-darwin, runner: macos-15-intel, simd: true, python: "3.10", lowest: true }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0 (2026-11-13)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0 (2026-11-13)
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0 (2026-11-13)
        with:
          name: wheel-${{ matrix.wheel }}
          path: dist
      - name: Install the wheel
        shell: bash
        run: |
          python -m pip install uv tomli
          uv venv -p python .venv-test
          if [ "${{ matrix.lowest }}" = "true" ]; then
            # every dependency with its bounds as pyproject.toml states it (tomllib; tomli on 3.10)
            deps=$(python -c "import sys; t = __import__('tomllib' if sys.version_info >= (3, 11) else 'tomli'); print(' '.join(t.load(open('pyproject.toml','rb'))['project']['dependencies']))")
            VIRTUAL_ENV=.venv-test uv pip install --resolution lowest-direct dist/*.whl $deps "pytest>=8" "pytest-xdist>=3"
          else
            VIRTUAL_ENV=.venv-test uv pip install dist/*.whl "pytest>=8" "pytest-xdist>=3"
          fi
      - name: The kernels are used (params.json of a small run, CPU path)
        shell: bash
        env:
          EPIREFINE_EXPECT_KERNELS: "1"
        run: |
          .venv-test/bin/python -c "from epirefine import _rs; print(_rs.summary()); assert _rs.kernels('model_kernels') is not None"
          .venv-test/bin/epirefine --version
          .venv-test/bin/python -m pytest -q tests/test_kernels_fallback.py tests/test_run_record.py::test_params_record_code_libraries_kernels_threads_seeds
      - name: Tests
        shell: bash
        env:
          EPIREFINE_EXPECT_KERNELS: "1"
        run: .venv-test/bin/python -m pytest -q -n auto tests
      - name: Kernel tests on the generic CPU path
        if: matrix.simd && !matrix.lowest
        shell: bash
        env:
          EPIREFINE_EXPECT_KERNELS: "1"
          EPIREFINE_RS_NO_SIMD: "1"
        run: .venv-test/bin/python -m pytest -q -n auto tests/test_kernels_*.py tests/test_rs_*.py tests/test_threads.py

  test-musl:
    name: Test musllinux_1_2 x86_64 on Python ${{ matrix.python }}
    needs: wheels
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0 (2026-11-13)
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0 (2026-11-13)
        with:
          name: wheel-x86_64-unknown-linux-musl
          path: dist
      - name: Tests in Alpine (binary dependencies only, so a missing musl wheel of a dependency fails fast)
        run: |
          docker run --rm -v "$PWD:/w" -w /w -e EPIREFINE_EXPECT_KERNELS=1 python:${{ matrix.python }}-alpine sh -c '
            pip install --only-binary :all: dist/*.whl "pytest>=8" "pytest-xdist>=3" &&
            python -c "from epirefine import _rs; print(_rs.summary()); assert _rs.kernels(\"model_kernels\") is not None" &&
            epirefine --version &&
            python -m pytest -q -n auto tests &&
            EPIREFINE_RS_NO_SIMD=1 python -m pytest -q -n auto tests/test_kernels_cpu_path.py tests/test_rs_model.py'

  test-pure:
    name: Test the pure wheel on Python ${{ matrix.python }}${{ matrix.lowest && ' (lowest pins)' || '' }}
    needs: pure-and-sdist
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: "3.13", lowest: false }
          - { python: "3.10", lowest: true }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0 (2026-11-13)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0 (2026-11-13)
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0 (2026-11-13)
        with:
          name: pure-and-sdist
          path: dist
      - name: Install (the lowest versions pyproject.toml allows on the lowest leg)
        run: |
          python -m pip install uv
          uv venv .venv-test
          if [ "${{ matrix.lowest }}" = "true" ]; then
            deps=$(/usr/bin/python3 -c "import tomllib; print(' '.join(tomllib.load(open('pyproject.toml','rb'))['project']['dependencies']))")
            VIRTUAL_ENV=.venv-test uv pip install --resolution lowest-direct dist/*-py3-none-any.whl $deps "pytest>=8" "pytest-xdist>=3"
          else
            VIRTUAL_ENV=.venv-test uv pip install dist/*-py3-none-any.whl "pytest>=8" "pytest-xdist>=3"
          fi
          .venv-test/bin/python -c "import numpy, scipy, polars; print('numpy', numpy.__version__, 'scipy', scipy.__version__, 'polars', polars.__version__)"
      - name: Test (numpy code and its warning)
        run: |
          .venv-test/bin/python -c "from epirefine import _rs; r = _rs.reason(); print(r); assert r.startswith('no compiled extension')"
          .venv-test/bin/epirefine --version
          .venv-test/bin/python -m pytest -q -n auto tests

  test-sdist:
    name: Build from the sdist (Rust) and test
    needs: pure-and-sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0 (2026-11-13)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0 (2026-11-13)
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master (2026-11-13)
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0 (2026-11-13)
        with:
          name: pure-and-sdist
          path: dist
      - name: The sdist holds what a build needs, and no binary, CI or dev file
        run: |
          python - dist/*.tar.gz <<'PY'
          import sys, tarfile
          names = {n.split("/", 1)[1] for n in tarfile.open(sys.argv[1]).getnames() if "/" in n}
          need = {"pyproject.toml", "LICENSE", "README.md", "rust/Cargo.toml", "rust/Cargo.lock", "rust/build.rs",
                  "rust/src/lib.rs", "rust/src/model.rs", "rust/THIRD_PARTY_LICENSES.txt",
                  "src/epirefine/_kernels/__init__.py", "src/epirefine/_rs.py", "tests/test_kernels_fallback.py"}
          bad = sorted(n for n in names if n.endswith((".so", ".pyd", ".dylib"))
                       or n.startswith((".github/", "dev/", "rust/target/")) or "__pycache__" in n)
          print(len(names), "files; missing:", sorted(need - names), "unwanted:", bad)
          sys.exit(1 if need - names or bad else 0)
          PY
      - name: Build and install from the sdist (no binary of epirefine), outside the checkout
        run: |
          python -m pip install uv
          uv venv -p python "$RUNNER_TEMP/venv-sdist"
          cd "$RUNNER_TEMP"
          VIRTUAL_ENV="$RUNNER_TEMP/venv-sdist" uv pip install --no-binary epirefine "$GITHUB_WORKSPACE"/dist/*.tar.gz "pytest>=8" "pytest-xdist>=3"
          mkdir sdist && tar xzf "$GITHUB_WORKSPACE"/dist/*.tar.gz -C sdist --strip-components 1
      - name: The kernels load; kernel tests from the sdist's own tests
        env:
          EPIREFINE_EXPECT_KERNELS: "1"
        run: |
          cd "$RUNNER_TEMP"
          venv-sdist/bin/python -c "from epirefine import _rs; print(_rs.summary()); assert _rs.kernels('model_kernels') is not None"
          venv-sdist/bin/epirefine --version
          venv-sdist/bin/python -m pytest -q -n auto sdist/tests/test_kernels_fallback.py sdist/tests/test_kernels_model_kernels.py sdist/tests/test_kernels_cpu_path.py sdist/tests/test_rs_model.py

  testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [version, licences, pure-and-sdist, test-wheels, test-musl, test-pure, test-sdist]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/epirefine
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0 (2026-11-13)
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # release/v1 (2026-11-13)
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  pypi:
    name: Publish to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/epirefine
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0 (2026-11-13)
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # release/v1 (2026-11-13)

  github-release:
    name: GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0 (2026-11-13)
        with:
          path: dist
          merge-multiple: true
      - name: Create the release with the built files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "EpiRefine ${GITHUB_REF_NAME#v}" --generate-notes
